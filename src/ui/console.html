<html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; connect-src 'none'"><title>Aurora — консоль Minecraft</title><link rel="stylesheet" href="console.css"></head><body><header><div><h1>Консоль Minecraft</h1><span id="console-status">Ожидание игры</span></div><div><label><input id="console-follow" type="checkbox" checked>Следить за журналом</label><button id="console-clear">Очистить экран</button><button id="console-stop">Остановить игру</button></div></header><label class="filter">Поиск в журнале<input id="console-filter" placeholder="Название мода или текст ошибки…"></label><pre id="console-output" aria-label="Журнал Minecraft"></pre><dialog id="console-confirm"><h2>Остановить Minecraft?</h2><p>Несохранённый прогресс может быть потерян.</p><form method="dialog"><button value="cancel">Отмена</button><button id="console-accept" value="accept">Остановить</button></form></dialog><script src="theme-schema.js"></script><script src="dialog-dismiss.js"></script><script src="console.js"></script></body></html>
