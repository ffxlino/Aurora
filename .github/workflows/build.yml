name: Windows build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'documentation/**', '*.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows-x64
          path: dist/Aurora-*-Windows-x64.exe
          if-no-files-found: error
