name: Windows and Linux builds
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'documentation/**', '*.md']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run runtime:install
      - run: npm run content:build
      - run: npm test
      - run: npm ci --prefix cloud
      - run: npm run content:build
      - run: npm test --prefix cloud
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows-x64
          path: dist/Aurora-*-Windows-x64.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2 xvfb libgtk-3-0 libnss3 libasound2
      - run: npm ci
      - run: npm run runtime:install
      - run: npm run content:build
      - run: npm test
      - run: npm ci --prefix cloud
      - run: npm run content:build
      - run: npm test --prefix cloud
      - run: npm run verify:engine
      - run: npm run dist:linux -- --publish never
      - name: Verify Linux interface
        run: xvfb-run -a dist/linux-unpacked/aurora --no-sandbox --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Linux-x64
          path: |
            dist/Aurora-*.AppImage
            dist/Aurora-*.pacman
            artifacts/smoke.json
            artifacts/official-install-result.json
          if-no-files-found: error
  arch:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aurora-Linux-x64
          path: artifacts-linux
      - name: Install and verify the pacman package on Arch Linux
        run: |
          mkdir -p arch-validation
          docker run --rm --shm-size=1g --mount type=bind,source="$PWD/artifacts-linux",target=/packages,readonly --mount type=bind,source="$PWD/arch-validation",target=/results archlinux:base bash -euc '
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm xorg-server-xvfb xorg-xauth dbus libsecret ttf-dejavu
            pacman -U --noconfirm /packages/dist/Aurora-*-Linux-x64.pacman
            command -v aurora
            mkdir -p /work
            cd /work
            dbus-run-session -- xvfb-run -a aurora --no-sandbox --disable-gpu --disable-dev-shm-usage --smoke
            cp /work/artifacts/smoke.json /results/smoke.json
            cp /work/artifacts/aurora-0.12-library.png /results/library.png
          '
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Arch-validation
          path: arch-validation
          if-no-files-found: error
