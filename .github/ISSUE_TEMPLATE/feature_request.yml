name: Предложение / Feature request
description: Какую пользовательскую задачу стоит сделать удобнее?
title: "[Idea]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу сейчас неудобно решать?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Как должен выглядеть результат?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Платформа и версия Aurora
